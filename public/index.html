<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Circle Keeper</title>
<style>
  :root { --bg:#fbf7f2; --ink:#2a2230; --muted:#7b7183; --card:#fff; --accent:#7c3aed; --gold:#f5b301; --ok:#16a34a; --bad:#dc2626; --line:#eadfd3; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 980px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { margin: 0; font-size: 28px; letter-spacing: -0.5px; }
  .sub { color: var(--muted); margin: 4px 0 20px; }
  .badges { display:flex; gap:8px; margin-bottom: 16px; flex-wrap: wrap; }
  .badge { font-size: 12px; padding: 3px 10px; border-radius: 99px; background:#efe7f8; color:#5b21b6; }
  .badge.off { background:#fde8e8; color:#991b1b; }
  .grid { display:grid; grid-template-columns: 340px 1fr; gap: 20px; }
  @media (max-width: 800px) { .grid { grid-template-columns: 1fr; } }
  .card { background:var(--card); border:1px solid var(--line); border-radius: 16px; padding: 18px; }
  .ring { width: 100%; height: auto; }
  button { font: inherit; cursor: pointer; border: 0; border-radius: 10px; padding: 8px 14px; background: var(--accent); color: #fff; font-weight: 600; }
  button.ghost { background: #f1ecf7; color: #4c1d95; }
  button.gold { background: var(--gold); color: #3b2a00; }
  button:disabled { opacity: .45; cursor: not-allowed; }
  .row { display:flex; align-items:center; gap:10px; padding: 10px 0; border-top: 1px solid var(--line); }
  .row:first-child { border-top: 0; }
  .pos { width: 26px; height: 26px; border-radius: 50%; background: var(--ink); color:#fff; display:grid; place-items:center; font-size: 13px; flex: none; }
  .who { flex: 1; min-width: 0; }
  .who small { color: var(--muted); display:block; }
  .tag { font-size: 11px; padding: 2px 8px; border-radius: 99px; font-weight: 700; }
  .low { background:#dcfce7; color:#166534; } .medium { background:#fef3c7; color:#92400e; } .high { background:#fee2e2; color:#991b1b; }
  .paid { color: var(--ok); font-weight: 700; font-size: 14px; }
  .actions { display:flex; gap:8px; flex-wrap: wrap; margin-bottom: 14px; }
  .note { background:#faf5ff; border:1px solid #e9d5ff; border-radius: 12px; padding: 12px 14px; margin: 12px 0; font-size: 15px; }
  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--ink); color:#fff; padding: 10px 18px; border-radius: 12px; max-width: 90vw; }
  .toast.bad { background: var(--bad); }
  .empty { text-align:center; padding: 56px 16px; }
  .empty p { color: var(--muted); max-width: 460px; margin: 8px auto 20px; }
  input[type=number] { width: 54px; padding: 6px; border:1px solid var(--line); border-radius: 8px; font: inherit; }
</style>
</head>
<body>
<main>
  <h1>Circle Keeper</h1>
  <p class="sub">An AI coordinator for lending circles. Everyone pays in, one person receives the pot, every round.</p>
  <div class="badges" id="badges"></div>
  <div id="app"></div>
</main>
<div id="toast" class="toast" style="display:none"></div>

<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
let S = null;
let nudgeText = null;

async function api(path, body) {
  const res = await fetch(path, body === undefined ? {} : { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || 'Request failed');
  return data;
}

function toast(msg, bad) {
  const t = $('#toast');
  t.textContent = msg;
  t.className = 'toast' + (bad ? ' bad' : '');
  t.style.display = 'block';
  clearTimeout(toast.t);
  toast.t = setTimeout(() => (t.style.display = 'none'), 4500);
}

async function run(fn) {
  try { await fn(); } catch (e) { toast(e.message, true); }
}

async function refresh() { S = await api('/api/circle'); render(); }

const seed = () => run(async () => { S = await api('/api/demo', {}); nudgeText = null; render(); toast('Demo circle loaded'); });
const planAI = () => run(async () => { toast('The coordinator is thinking...'); S = await api('/api/circle/plan', {}); render(); const failed = /^AI planning (failed|is off)/.test(S.circle.rationale || ''); toast(failed ? S.circle.rationale : 'Rotation planned', failed); });
const pay = (id) => run(async () => { const d = await api('/api/circle/pay', { memberId: id }); location.href = d.approveUrl; });
const payout = () => run(async () => { S = await api('/api/circle/payout', {}); render(); toast('Payout sent through PayPal'); });
const nudge = (id) => run(async () => {
  const daysLate = Number($('#days').value) || 3;
  const name = S.circle.members.find((m) => m.id === id).name;
  const d = await api('/api/circle/nudge', { memberId: id, daysLate });
  nudgeText = { name, text: d.text };
  render();
});

function ring(c) {
  const n = c.members.length, cx = 160, cy = 160, R = 120;
  let s = `<svg viewBox="0 0 320 320" class="ring"><circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="#eadfd3" stroke-width="2" stroke-dasharray="4 6"/>`;
  c.members.forEach((m, i) => {
    const a = -Math.PI / 2 + (i * 2 * Math.PI) / n;
    const x = cx + R * Math.cos(a), y = cy + R * Math.sin(a);
    const isR = c.recipient && c.recipient.id === m.id;
    s += `<circle cx="${x}" cy="${y}" r="28" fill="${m.paid ? '#16a34a' : '#e9e3ee'}" stroke="${isR ? '#f5b301' : '#fff'}" stroke-width="${isR ? 6 : 3}"/>`;
    s += `<text x="${x}" y="${y + 5}" text-anchor="middle" font-size="15" font-weight="700" fill="${m.paid ? '#fff' : '#2a2230'}">${esc(m.name.slice(0, 2))}</text>`;
    s += `<circle cx="${x + 21}" cy="${y - 21}" r="10" fill="#2a2230"/><text x="${x + 21}" y="${y - 17}" text-anchor="middle" font-size="11" fill="#fff">${m.position}</text>`;
  });
  const done = c.status === 'complete';
  s += `<text x="${cx}" y="${cy - 6}" text-anchor="middle" font-size="26" font-weight="800" fill="#2a2230">${esc(c.currency)} ${c.pot}</text>`;
  s += `<text x="${cx}" y="${cy + 18}" text-anchor="middle" font-size="13" fill="#7b7183">${done ? 'Circle complete' : `Round ${c.round + 1} of ${c.totalRounds}`}</text>`;
  return s + '</svg>';
}

function render() {
  const b = $('#badges');
  b.innerHTML = `<span class="badge ${S.paypalConfigured ? '' : 'off'}">PayPal sandbox: ${S.paypalConfigured ? 'connected' : 'not configured'}</span>` +
    `<span class="badge ${S.aiEnabled ? '' : 'off'}">AI coordinator: ${S.aiEnabled ? 'on' : 'off'}</span>`;
  const app = $('#app');
  const c = S.circle;
  if (!c) {
    app.innerHTML = `<div class="card empty"><h2>No circle yet</h2><p>Lending circles (tandas, susus, chit funds) move billions of dollars a year, mostly through spreadsheets and group chats. Start a demo circle to see an AI coordinate one.</p><button onclick="seed()">Load demo circle</button></div>`;
    return;
  }
  const paidCount = c.members.filter((m) => m.paid).length;
  const all = paidCount === c.members.length;
  const canPlan = c.round === 0 && paidCount === 0;
  const done = c.status === 'complete';

  let html = `<div class="grid"><div class="card"><strong>${esc(c.name)}</strong><div style="color:var(--muted);font-size:14px">${esc(c.currency)} ${c.amount} per person per round</div>${ring(c)}</div><div class="card">`;
  html += `<div class="actions">`;
  if (canPlan) html += `<button class="gold" onclick="planAI()">Let AI plan the rotation</button>`;
  if (!done) html += `<button ${all ? '' : 'disabled'} onclick="payout()">Pay out ${esc(c.currency)} ${c.pot} to ${esc(c.recipient.name)}</button>`;
  html += `<button class="ghost" onclick="seed()">Reset demo</button></div>`;
  if (c.rationale) html += `<div class="note"><strong>Coordinator's plan.</strong> ${esc(c.rationale)}</div>`;
  if (!done) html += `<div style="font-size:14px;color:var(--muted);margin-bottom:6px">${paidCount} of ${c.members.length} paid this round. Receiving: <strong style="color:var(--ink)">${esc(c.recipient.name)}</strong>. Days late for nudges: <input id="days" type="number" min="1" value="3"></div>`;
  c.members.forEach((m) => {
    const isR = c.recipient && c.recipient.id === m.id;
    html += `<div class="row"><div class="pos">${m.position}</div><div class="who"><strong>${esc(m.name)}</strong> ${isR ? '<span class="tag" style="background:#fef3c7;color:#92400e">receives this round</span>' : ''}` +
      `${m.risk ? ` <span class="tag ${m.risk.level}">${esc(m.risk.level)} risk</span><small>${esc(m.risk.reason)}</small>` : `<small>${esc(m.note)}</small>`}</div>`;
    if (!done) html += m.paid ? `<span class="paid">Paid</span>` : `<button onclick="pay('${m.id}')">Pay with PayPal</button><button class="ghost" onclick="nudge('${m.id}')">Nudge</button>`;
    html += `</div>`;
  });
  if (nudgeText) html += `<div class="note"><strong>Draft nudge for ${esc(nudgeText.name)}:</strong><br>${esc(nudgeText.text)}</div>`;
  if (c.payouts.length) {
    html += `<h3 style="margin:18px 0 6px">Payout history</h3>`;
    c.payouts.forEach((p) => { html += `<div style="font-size:14px">Round ${p.round + 1}: ${esc(c.currency)} ${p.amount} to <strong>${esc(p.recipient)}</strong> <span style="color:var(--muted)">(${esc(p.status || 'sent')})</span></div>`; });
  }
  html += `</div></div>`;
  app.innerHTML = html;
}

const q = new URLSearchParams(location.search);
if (q.get('paid')) toast(`${q.get('paid')}'s contribution received`);
if (q.get('error')) toast(q.get('error'), true);
if (q.toString()) history.replaceState(null, '', '/');
run(refresh);
</script>
</body>
</html>
